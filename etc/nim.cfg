# NIM Metashell — System-scope Configuration (defaults)
#
# Loaded by lib/core/cfg.sh via nim.cfg.load. Resolution order is:
#
#   env > project (./.nim/nim.cfg) > user (~/.nim/nim.cfg) > system (this file)
#
# Highest priority loads FIRST. Each scope uses conditional assignment
# (`: ${VAR:=value}`) so that any value already set is preserved. To force
# a value at any scope, use unconditional assignment (`VAR=value`) — but
# understand that does override anything the operator set in env.

# --- Logging ----------------------------------------------------------------
: ${NIM_LOGLEVEL:=4}                  # 0=off 3=err 4=warn 6=info 7=trace
# : ${NIM_LOGFILE:="${NIM_OPS}/log/nim.log"}
# : ${NIM_LOGTAG:="nim"}

# --- Color / Output ---------------------------------------------------------
: ${NIM_COLOR:=1}                     # 1=enable when tty, 0=force off

# --- Codex ------------------------------------------------------------------
# : ${NIM_CODEX_STORE:="${NIM_OPS}/codex"}

# --- Operator Defaults ------------------------------------------------------
# : ${NIM_DEFAULT_EDITOR:="${EDITOR:-vim}"}
